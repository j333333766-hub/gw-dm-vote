<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>다면평가자 선정 투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--sub:#5d6678;--line:#e1e5ec;--brand:#2453c7;--brand-ink:#fff;--soft:#eaf0fd;--ok:#1f8a4c;--okbg:#e6f5ec;--warn:#b25b00;--warnbg:#fff3e0;--bad:#c62828;--badbg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf1;--sub:#a3abba;--line:#2c3340;--brand:#6f9bff;--brand-ink:#0d1220;--soft:#1f2a44;--ok:#5fd18f;--okbg:#14301f;--warn:#ffb35c;--warnbg:#33240f;--bad:#ff7b7b;--badbg:#3a1717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header h1{font-size:21px;margin:4px 0 6px;line-height:1.35;word-break:keep-all}
.school{color:var(--sub);font-size:14px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px;font-size:14px;color:var(--sub)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.b-open{background:var(--okbg);color:var(--ok)}.b-wait{background:var(--warnbg);color:var(--warn)}.b-off{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.guide{white-space:pre-line;font-size:14.5px;color:var(--sub)}
h2{font-size:17px;margin:0 0 12px}
label.f{display:block;font-weight:600;margin:12px 0 6px;font-size:15px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.hint{font-size:13px;color:var(--sub);margin-top:4px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.row2{display:flex;gap:10px}.row2 .btn{margin-top:16px}
.q{border-top:1px solid var(--line);padding:16px 0 4px}.q:first-of-type{border-top:0;padding-top:0}
.q h3{font-size:16px;margin:0 0 4px;word-break:keep-all}
.q .no{color:var(--brand);margin-right:4px}
.req{color:var(--bad);font-size:13px;margin-left:4px}
.q .desc{font-size:13.5px;color:var(--sub);margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--brand)}
.opt.on{border-color:var(--brand);background:var(--soft)}
.msg{padding:11px 13px;border-radius:10px;margin-top:12px;font-size:14.5px}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.info{background:var(--soft);color:var(--ink)}
.sum dt{font-weight:700;font-size:14px;margin-top:10px}.sum dd{margin:2px 0 0;color:var(--sub);font-size:14.5px}
.center{text-align:center}.big{font-size:44px;line-height:1}
.hidden{display:none!important}
footer{text-align:center;font-size:12.5px;color:var(--sub);margin-top:28px}
footer a{color:var(--sub)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--brand)}
.tl{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.last{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:700;vertical-align:1px;white-space:nowrap}
.texts p{background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px;white-space:pre-line}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="school">구월중학교 다면평가관리위원회</div>
    <h1 id="title">다면평가자 선정 투표</h1>
    <div class="meta"><span id="badge" class="badge b-wait">불러오는 중</span><span id="period"></span><span id="turnout"></span></div>
  </header>

  <div id="loading" class="card center">불러오는 중이에요…</div>

  <!-- 투표 -->
  <section id="vote" class="hidden">
    <div class="card guide" id="guide"></div>

    <div class="card" id="stepVerify">
      <h2>1. 본인 확인</h2>
      <form id="fVerify" autocomplete="off">
        <label class="f" for="nid">나이스 개인번호</label>
        <input type="password" id="nid" maxlength="14" placeholder="E로 시작하는 10자리" autocapitalize="characters">
        <div class="hint">개인번호는 본인 확인에만 쓰이고, 투표 내용과 함께 저장되지 않아요.</div>
        <button class="btn" id="bVerify" type="submit">확인</button>
      </form>
      <div id="mVerify"></div>
    </div>

    <div class="card hidden" id="stepBallot">
      <h2>2. 투표 <span class="hint" id="who"></span></h2>
      <form id="fBallot"><div id="qs"></div>
        <button class="btn" type="submit">다음: 고른 내용 확인</button>
      </form>
      <div id="mBallot"></div>
    </div>

    <div class="card hidden" id="stepConfirm">
      <h2>3. 고른 내용 확인</h2>
      <p class="hint">제출하면 바꿀 수 없어요.</p>
      <dl class="sum" id="sum"></dl>
      <div class="row2"><button class="btn ghost" id="bBack" type="button">고치기</button><button class="btn" id="bSubmit" type="button">제출</button></div>
      <div id="mConfirm"></div>
    </div>

    <div class="card hidden center" id="stepDone">
      <div class="big">✓</div>
      <h2 style="margin-top:12px">투표가 끝났어요</h2>
      <p class="hint">참여해 주셔서 고맙습니다. 결과는 다면평가관리위원회에서 확인한 뒤 안내해 드려요.</p>
    </div>
  </section>

  <!-- 관리자 -->
  <section id="admin" class="hidden">
    <div class="card" id="admLogin">
      <h2>관리자 현황</h2>
      <form id="fAdmin"><label class="f" for="apw">비밀번호</label><input type="password" id="apw">
        <button class="btn" type="submit">보기</button></form>
      <div id="mAdmin"></div>
    </div>
    <div id="admView" class="hidden"></div>
  </section>

  <footer><a href="?admin" id="admLink">관리자</a></footer>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxkwzKGcq4EG9DIWqHJKlNrIZ-0qFWrDJLqGnWLlj8fRYoF7NG2toC0TStH-qcWJjPihA/exec';
const API = new URLSearchParams(location.search).get('api') || API_URL;
const isAdmin = new URLSearchParams(location.search).has('admin');
const $ = (id) => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle('hidden', !on);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let CFG = null, TOKEN = '', ANS = {};

const ERR = {
  nomatch: '등록된 나이스 개인번호가 아니에요. 다시 확인해 주세요.',
  nid: '나이스 개인번호를 확인해 주세요. (E로 시작하는 10자리)',
  name: '이름을 확인해 주세요.',
  noright: '이번 투표 대상(재직 중인 교원)이 아니에요. 잘못되었다면 교무기획부에 알려 주세요.',
  locked: '확인 실패가 많아 본인 확인을 10분 동안 막았어요. 잠시 뒤 다시 해 주세요.',
  closed: '지금은 투표 기간이 아니에요.', notyet: '아직 투표가 시작되지 않았어요.', ended: '투표가 마감되었어요.',
  already: '이미 투표하셨어요. 1인 1회만 투표할 수 있어요.',
  token: '본인 확인을 다시 해 주세요.', expired: '확인한 지 1시간이 지났어요. 본인 확인을 다시 해 주세요.',
  busy: '투표가 몰려 잠시 밀렸어요. 한 번 더 눌러 주세요.',
  pw: '비밀번호가 맞지 않아요.', network: '연결이 잘 안 돼요. 잠시 뒤 다시 해 주세요.', server: '서버에 문제가 생겼어요. 교무기획부에 알려 주세요.'
};
function errText(code) {
  const m = String(code).match(/^(need|option|one|max|alone):(.+)$/);
  if (m) return { need: `${m[2]}번 문항에 답해 주세요.`, option: `${m[2]}번 문항의 선택지가 바뀌었어요. 새로 고침 해 주세요.`, one: `${m[2]}번은 하나만 고를 수 있어요.`, max: `${m[2]}번은 고를 수 있는 개수를 넘었어요.`, alone: `${m[2]}번에서 '없음'은 다른 것과 함께 고를 수 없어요.` }[m[1]];
  return ERR[code] || `문제가 생겼어요 (${code})`;
}
function msg(id, text, kind = 'err') { $(id).innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ''; }

// Apps Script 는 text/plain 으로 보내야 브라우저 사전 확인(CORS) 없이 받는다
async function call(action, data = {}) {
  if (!API) return { ok: false, error: 'server' };
  let res;
  try { res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...data }), redirect: 'follow' }); }
  catch (e) { return { ok: false, error: 'network' }; }
  try { return await res.json(); } catch (e) { return { ok: false, error: 'network' }; }
}
const fmt = (t) => { if (!t) return ''; const d = new Date(t + 9 * 3600e3); const w = '일월화수목금토'[d.getUTCDay()]; return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${w}) ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; };

function head(c) {
  $('title').textContent = c.title || '다면평가자 선정 투표';
  document.title = c.title || document.title;
  const b = $('badge');
  const map = { open: ['투표 중', 'b-open'], notyet: ['시작 전', 'b-wait'], ended: ['마감', 'b-off'], closed: ['닫힘', 'b-off'] };
  const [t, cls] = map[c.state] || ['', 'b-wait']; b.textContent = t; b.className = 'badge ' + cls;
  $('period').textContent = (c.opensAt || c.closesAt) ? `${fmt(c.opensAt) || '지금'} ~ ${fmt(c.closesAt) || ''}` : '';
  if (c.eligible != null) $('turnout').textContent = `참여 ${c.voted}/${c.eligible}명`;
}

async function boot() {
  if (isAdmin) { show('loading', false); show('admin'); $('admLink').href = './'; $('admLink').textContent = '투표 화면'; return; }
  const r = await call('config');
  show('loading', false);
  if (!r.ok) { $('loading').textContent = errText(r.error); show('loading'); return; }
  CFG = r.result; head(CFG);
  $('guide').textContent = CFG.guide;
  show('vote');
  if (CFG.state !== 'open') { msg('mVerify', errText(CFG.state), 'info'); }
}

$('fVerify').addEventListener('submit', async (e) => {
  e.preventDefault(); msg('mVerify', '');
  const nid = $('nid').value.trim();
  if (!/^[A-Za-z0-9-\s]{6,14}$/.test(nid)) return msg('mVerify', ERR.nid);
  $('bVerify').disabled = true; $('bVerify').textContent = '확인 중…';
  const r = await call('verify', { nid });
  $('bVerify').disabled = false; $('bVerify').textContent = '확인';
  if (!r.ok) return msg('mVerify', errText(r.error));
  if (r.result.voted) return msg('mVerify', '이미 투표를 마친 번호예요. 참여해 주셔서 고맙습니다.', 'ok');
  if (CFG.state !== 'open') return msg('mVerify', errText(CFG.state), 'info');
  TOKEN = r.result.token; $('nid').value = '';
  $('who').textContent = '· 무기명';
  renderQs(); show('stepVerify', false); show('stepBallot'); window.scrollTo({ top: $('stepBallot').offsetTop - 12, behavior: 'smooth' });
});

function renderQs() {
  $('qs').innerHTML = CFG.questions.map((q) => {
    const h = `<h3><span class="no">${esc(q.no)}.</span>${esc(q.title)}${q.required ? '<span class="req">필수</span>' : ''}</h3>` + (q.desc ? `<p class="desc">${esc(q.desc)}</p>` : '');
    if (q.kind === 'text') return `<div class="q" data-no="${esc(q.no)}">${h}<textarea rows="3" maxlength="1000" data-no="${esc(q.no)}"></textarea></div>`;
    const type = q.kind === 'multi' ? 'checkbox' : 'radio';
    const note = q.kind === 'multi' ? `<p class="desc">여러 개 고를 수 있어요${q.max ? ` (최대 ${q.max}개)` : ''}.</p>` : '';
    return `<div class="q" data-no="${esc(q.no)}">${h}${note}` + q.options.map((o, i) =>
      `<label class="opt"><input type="${type}" name="q${esc(q.no)}" value="${esc(o)}"><span>${esc(o)}${(q.last || []).includes(o) ? '<span class="last">2025학년도 방식</span>' : ''}</span></label>`).join('') + '</div>';
  }).join('');
  $('qs').querySelectorAll('input').forEach((inp) => inp.addEventListener('change', () => {
    const box = inp.closest('.q'), q = CFG.questions.find((x) => x.no === box.dataset.no);
    if (q.kind === 'multi' && inp.checked) {
      const alone = /없음/.test(inp.value);
      box.querySelectorAll('input').forEach((o) => { if (o !== inp && (alone || /없음/.test(o.value))) o.checked = false; });
      const n = box.querySelectorAll('input:checked').length;
      if (q.max && n > q.max) { inp.checked = false; msg('mBallot', `최대 ${q.max}개까지 고를 수 있어요.`); }
    }
    box.querySelectorAll('.opt').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
  }));
}

function collect() {
  const a = {};
  for (const q of CFG.questions) {
    if (q.kind === 'text') a[q.no] = $('qs').querySelector(`textarea[data-no="${CSS.escape(q.no)}"]`).value.trim();
    else {
      const v = [...$('qs').querySelectorAll(`input[name="q${CSS.escape(q.no)}"]:checked`)].map((x) => x.value);
      a[q.no] = q.kind === 'multi' ? v : (v[0] || '');
    }
    const empty = Array.isArray(a[q.no]) ? !a[q.no].length : !a[q.no];
    if (q.required && empty) { return { err: q.no }; }
  }
  return { a };
}

$('fBallot').addEventListener('submit', (e) => {
  e.preventDefault(); msg('mBallot', '');
  const c = collect();
  if (c.err) { msg('mBallot', errText('need:' + c.err)); document.querySelector(`.q[data-no="${CSS.escape(c.err)}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  ANS = c.a;
  $('sum').innerHTML = CFG.questions.map((q) => {
    const v = ANS[q.no]; const t = Array.isArray(v) ? v.join(', ') : v;
    return `<dt>${esc(q.no)}. ${esc(q.title)}</dt><dd>${t ? esc(t) : '(없음)'}</dd>`;
  }).join('');
  show('stepBallot', false); show('stepConfirm'); window.scrollTo({ top: $('stepConfirm').offsetTop - 12, behavior: 'smooth' });
});
$('bBack').addEventListener('click', () => { show('stepConfirm', false); show('stepBallot'); msg('mConfirm', ''); });
$('bSubmit').addEventListener('click', async () => {
  const b = $('bSubmit'); b.disabled = true; b.textContent = '제출 중…'; msg('mConfirm', '');
  const r = await call('vote', { token: TOKEN, answers: ANS });
  b.disabled = false; b.textContent = '제출';
  if (!r.ok) {
    msg('mConfirm', errText(r.error));
    if (['token', 'expired'].includes(r.error)) { show('stepConfirm', false); show('stepVerify'); msg('mVerify', errText(r.error)); }
    return;
  }
  TOKEN = ''; show('stepConfirm', false); show('stepDone');
  CFG.voted++; head(CFG);
});

// ---------- 관리자 ----------
let APW = '';
$('fAdmin').addEventListener('submit', async (e) => { e.preventDefault(); APW = $('apw').value; await loadAdmin(); });
async function loadAdmin() {
  msg('mAdmin', '불러오는 중…', 'info');
  const r = await call('admin', { pw: APW });
  if (!r.ok) return msg('mAdmin', errText(r.error));
  msg('mAdmin', ''); show('admLogin', false); show('admView');
  const d = r.result, pct = d.eligible ? Math.round(d.voted / d.eligible * 100) : 0;
  head({ title: '관리자 현황', state: d.state, opensAt: d.opensAt, closesAt: d.closesAt, eligible: d.eligible, voted: d.voted });
  let h = `<div class="card"><h2>참여 현황</h2><div class="tl"><b>${d.voted} / ${d.eligible}명</b><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div>`
    + `<div class="hint">투표지 ${d.ballots}장 · 아직 투표하지 않은 선생님 ${d.notVoted.length}명</div><div class="chips">${d.notVoted.map((n) => `<span>${esc(n)}</span>`).join('')}</div>`
    + `<button class="btn ghost" id="bRe" type="button">새로 고침</button></div>`;
  h += d.questions.map((q) => {
    if (q.kind === 'text') return `<div class="card"><h2>${esc(q.no)}. ${esc(q.title)}</h2><div class="texts">${q.texts.length ? q.texts.map((t) => `<p>${esc(t)}</p>`).join('') : '<p class="hint">의견 없음</p>'}</div></div>`;
    const tot = q.kind === 'multi' ? (q.answered || 0) : q.options.reduce((s, o) => s + o.count, 0);
    return `<div class="card"><h2>${esc(q.no)}. ${esc(q.title)}</h2>` + q.options.map((o) => {
      const p = tot ? Math.round(o.count / tot * 100) : 0;
      return `<div class="tl"><span>${esc(o.label)}${(q.last || []).includes(o.label) ? '<span class="last">2025학년도 방식</span>' : ''}</span><b>${o.count}표</b></div><div class="bar"><i style="width:${p}%"></i></div>`;
    }).join('') + (q.kind === 'multi' ? `<div class="hint">응답 ${tot}명 기준 (여러 개 선택)</div>` : '') + '</div>';
  }).join('');
  $('admView').innerHTML = h;
  $('bRe').addEventListener('click', loadAdmin);
}

boot();
</script>
</body>
</html>
